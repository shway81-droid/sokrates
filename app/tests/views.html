<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>화면 확인 (가짜 AI)</title>
  <link rel="stylesheet" href="../core/style.css?v=5">
  <style>
    #harness { margin: 24px; padding: 16px; border: 3px dashed #999; font: 16px/1.5 monospace; background: #fff; color: #222; }
    #harness pre { white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; }
  </style>
</head>
<body>
  <!--
    화면 확인 페이지: 키 없이 가짜 AI로 각 방법의 화면을 차례로 띄우고 #screen 의 HTML 을 찍습니다.
    - ?run=elenchus            장면 HTML 을 #out 에 JSON 으로 냅니다.
    - ?run=elenchus&compare=1  tests/fixtures/elenchus-views-baseline.js 와 비교합니다.
    - &stop=장면이름           그 장면에서 멈춰 화면을 그대로 둡니다(스크린샷용).
    이 페이지는 localStorage 에 아무것도 쓰지 않습니다(저장된 키·선택값을 건드리지 않음).
  -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">?</span>
      <span class="brand-name">소크라테스 학습정리</span>
      <span class="brand-method" id="bar-method"></span>
    </div>
    <div class="bar-right">
      <span class="chip" id="bar-context" hidden></span>
      <span class="timer" id="bar-timer" hidden aria-label="지난 시간">0:00</span>
      <button class="icon-btn" id="bar-home" type="button" hidden>처음으로</button>
      <button class="icon-btn" id="bar-settings" type="button">설정</button>
    </div>
  </header>

  <main id="screen" aria-live="polite"></main>

  <section id="harness"><b id="status">준비 중…</b><pre id="out"></pre></section>

  <script>
    // 저장소를 읽기만 하고 쓰지 않게 합니다. sok.* 선택값은 없는 것으로 봅니다(장면마다 같은 시작 화면).
    (function () {
      const get = Storage.prototype.getItem;
      Storage.prototype.setItem = function () {};
      Storage.prototype.removeItem = function () {};
      Storage.prototype.getItem = function (k) { return String(k).startsWith("sok.") ? null : get.call(this, k); };
    })();
  </script>
  <script src="../data/units.js"></script>
  <script src="../data/topic-3-1.js?v=3"></script>
  <script src="../data/topic-3-2.js?v=3"></script>
  <script src="../data/detective-3-1.js?v=5" onerror="this.remove()"></script>
  <script src="../data/detective-3-2.js?v=4" onerror="this.remove()"></script>
  <script src="fixtures/detective-problems.js"></script>
  <script src="../core/guard.js"></script>
  <script src="../core/topic.js"></script>
  <script src="../core/catalog.js"></script>
  <script src="../core/llm.js"></script>
  <script>
    // 가짜 AI: window.FAKE_QUEUE 의 응답을 차례로 돌려줍니다. Error 면 throw, "PENDING" 이면 끝나지 않습니다.
    window.FAKE_QUEUE = [];
    window.FAKE_CALLS = [];
    (function (L) {
      L.loadSettings = () => ({ apiKey: "fake", model: "claude-haiku-5-5", effort: "low" });
      L.saveSettings = () => {};
      L.clearKey = () => {};
      L.createClaudeLLM = () => ({
        call(req) {
          window.FAKE_CALLS.push(req);
          const r = window.FAKE_QUEUE.shift();
          if (r === "PENDING") return new Promise(() => {});
          if (r === undefined) return Promise.reject(new Error("가짜 응답이 더 없음"));
          if (r instanceof Error) return Promise.reject(r);
          return Promise.resolve(JSON.parse(JSON.stringify(r)));
        },
      });
    })(window.SokLLM);
    delete window.SOKRATES_TEXTS;
  </script>
  <script src="../core/ui.js?v=3"></script>
  <script src="../core/parts.js?v=5"></script>
  <script src="../methods/elenchus.js"></script>
  <script src="../methods/elenchus-views.js?v=4"></script>
  <script src="../methods/friend.js?v=9"></script>
  <script src="../methods/friend-views.js?v=8"></script>
  <script src="../methods/detective.js?v=15"></script>
  <script src="../methods/detective-views.js?v=4"></script>
  <script src="../core/app.js?v=3"></script>
  <script src="fixtures/elenchus-views-baseline.js?v=2" onerror="this.remove()"></script>
  <script>
  (async function () {
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const run = params.get("run") || "elenchus";
    const stopAt = params.get("stop");
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    async function until(pred, what) {
      for (let i = 0; i < 100; i++) { if (pred()) return; await sleep(20); }
      throw new Error(`기다림 시간 초과: ${what}`);
    }
    const q = (sel) => document.querySelector(`#screen ${sel}`);
    const btn = (text) => [...document.querySelectorAll("#screen button")].find((b) => b.textContent === text);
    const click = (text) => { const b = btn(text); if (!b) throw new Error(`버튼 없음: ${text}`); b.click(); };
    const normalize = (html) => html.replace(/\d+:\d\d/g, "0:00").replace(/\d{4}-\d{2}-\d{2}/g, "DATE");
    const shots = {};
    const snap = (name) => { shots[name] = normalize($("screen").innerHTML); if (name === stopAt) throw "STOP"; };
    const queue = (...r) => window.FAKE_QUEUE.push(...r);
    const home = async () => { $("bar-home").click(); await until(() => btn("시작하기"), "시작 화면"); };
    const begin = async () => { click("시작하기"); await until(() => q("#item-0") || q("#explain"), "입력 화면"); };
    const fill = (sel, values) => values.forEach((v, i) => { q(sel(i)).value = v; });

    // ---------- 엘렌코스 장면 ----------
    const three = ["북한이 남침했다", "유엔군이 도와주었다", "전쟁은 1953년에 끝났다"];
    const SUM = { learned: "북한의 남침과 국제 연합군의 참전", rethought: "1953년에 전쟁이 끝난 게 아니라 멈췄다", nextQuestion: "정전과 종전은 어떻게 다를까요?" };
    const CHECK = { stage: "check", checks: ["ok", "ok", "think"], target: 2, mode: "counter", misconception: "3-2.m01", question: "전쟁이 끝났다면 왜 지금도 휴전선이 있을까요?" };
    const Q2 = { stage: "question", question: "아직 나뉘어 있다면 전쟁이 끝난 것일까요?", verdict: "none", summary: { learned: "", rethought: "", nextQuestion: "" } };
    const V = (v, s = SUM) => ({ stage: "verdict", question: "", verdict: v, summary: s });
    const REASON = { stage: "check", checks: ["ok", "ok", "ok"], target: 0, mode: "reason", misconception: "none", question: "북한은 왜 쳐들어왔을까요?" };
    const RETRY = { stage: "check", checks: ["ok", "outside", "outside"], target: 1, mode: "retry", misconception: "none", question: "오늘 배운 것 중에서 하나 더 말해 볼까요?" };

    async function submitElenchus(items) {
      fill((i) => `#item-${i}`, items);
      click("확인하기");
    }
    async function answer(text) {
      q("#answer").value = text;
      click("보내기");
    }
    const asking = () => q(".qcard .q");
    const done = () => btn("다음 학생");

    const SCENES = {
      async elenchus() {
        snap("start");
        // 6·25 오개념(3-2.m01)이 범위에 들도록 천재 12차시를 고릅니다(도움말에 교과서 내용이 나오는 장면).
        const lesson = q("#lesson"); lesson.value = "3-12"; lesson.dispatchEvent(new Event("change"));
        await until(() => q("#lesson") && q("#lesson").value === "3-12", "12차시");
        await begin(); snap("input");
        queue("PENDING"); await submitElenchus(three); await until(() => q(".thinking"), "생각 중"); snap("waiting");
        await home();
        await begin(); queue(CHECK); await submitElenchus(three); await until(asking, "질문 1"); snap("asking-1");
        queue(Q2); await answer("아직 남북이 나뉘어 있어서요."); await until(() => q(".history") && asking(), "질문 2"); snap("asking-2");
        queue(V("revisit")); await answer("아, 싸움만 멈춘 거네요."); await until(done, "결과"); snap("result-revisit");
        await home();
        await begin(); queue(REASON, V("strong", { learned: "북한이 38도선을 넘어 쳐들어왔다", rethought: "힘으로 통일하려고 쳐들어왔다", nextQuestion: "전쟁은 사람들의 삶을 어떻게 바꾸었을까요?" }));
        await submitElenchus(three); await until(asking, "이유 질문");
        await answer("힘으로 통일하려고요."); await until(done, "결과"); snap("result-strong-reason");
        await home();
        await begin(); queue(RETRY, V("hold", { learned: "북한이 남침했다", rethought: "전쟁에 참여한 나라를 더 떠올려 보아요", nextQuestion: "국제 연합군은 왜 왔을까요?" }));
        await submitElenchus(["북한이 남침했다", "몰라요", "그냥요"]); await until(asking, "다시 말하기");
        click("바로 정리하기"); await until(done, "결과"); snap("result-hold-retry");
        await home();
        await begin(); queue(new Error("연결 실패")); await submitElenchus(three); await until(() => q(".error-box"), "오류"); snap("error");
        $("bar-settings").click(); await until(() => q("#api-key"), "설정"); snap("settings");
      },

      // ---------- 모르는 친구 장면 (천재 12차시) ----------
      async friend() {
        const pick = async (id, value) => { const s = q(id); s.value = value; s.dispatchEvent(new Event("change")); await until(() => q(id) && q(id).value === value, id); };
        await pick("#method", "friend");
        await pick("#lesson", "3-12");
        snap("start");
        const EXPLAIN = "북한이 쳐들어와서 전쟁이 났고 많은 사람이 다쳤어요.";
        const ASK1 = { stage: "ask", mark: "none", kind: "meaning", misconception: "none", reaction: "", question: "전쟁이 나면 왜 사람들이 다쳐요?" };
        const ASK2 = { stage: "ask", mark: "explained", kind: "mixup", misconception: "3-2.m06", reaction: "아, 그렇군요!", question: "그럼 싸운 군인들만 다친 거예요?" };
        const ASK3 = { stage: "ask", mark: "corrected", kind: "meaning", misconception: "none", reaction: "몰랐어요!", question: "피란은 왜 가야 했어요?" };
        const FIN = (mark) => ({ stage: "finish", mark, thanks: "덕분에 보통 사람들도 다쳤다는 걸 알았어요!", nextQuestion: "사람들은 왜 피란을 떠났을까요?" });
        const explain = (t) => { q("#explain").value = t; click("보내기"); };
        await begin(); snap("input");
        queue("PENDING"); explain(EXPLAIN); await until(() => q(".thinking"), "생각 중"); snap("waiting");
        await home();
        await begin(); queue(ASK1); explain(EXPLAIN); await until(asking, "질문 1"); snap("asking-1");
        queue(ASK2); await answer("마을에서도 싸워서 집이 부서지고 사람들이 다쳤어요."); await until(() => q(".reaction"), "질문 2"); snap("asking-2");
        queue(ASK3); await answer("아니에요. 피란 가던 보통 사람들도 많이 다쳤어요."); await until(() => asking() && asking().textContent === ASK3.question, "질문 3"); snap("asking-3");
        queue(FIN("together")); await answer("몰라요."); await until(done, "결과"); snap("result-mixed");
        await home();
        await begin(); queue(ASK1, FIN("none")); explain("몰라요"); await until(asking, "질문 1");
        click("바로 정리하기"); await until(done, "결과"); snap("result-none");
        await home();
        await begin(); queue(new Error("연결 실패")); explain(EXPLAIN); await until(() => q(".error-box"), "오류"); snap("error");
      },

      // ---------- 오답 탐정 장면 (천재 12차시, 테스트용 문제 묶음: 문제 1 = 3-2.m06.a 숨은 2번째, 문제 2 = 3-2.m02.a 숨은 3번째) ----------
      async detective() {
        window.SokDetectiveData = { fixture: { problems: window.SOK_DETECTIVE_FIXTURE } };
        Math.random = () => 0;
        const pick = async (id, value) => { const s = q(id); s.value = value; s.dispatchEvent(new Event("change")); await until(() => q(id) && q(id).value === value, id); };
        await pick("#method", "detective");
        await pick("#lesson", "3-12");
        snap("start");
        const go = async () => {
          SokDetective.SERVED.clear();
          click("시작하기"); await until(() => btn("시작"), "시작 안내");
        };
        const card = async (i) => { q(`.dt-card[data-i="${i}"]`).click(); await until(() => q("#reason"), "까닭 칸"); };
        const reason = (t) => { q("#reason").value = t; click("보내기"); };
        const ASK = (question) => ({ result: "ask", question });
        await go(); snap("input");
        click("시작"); await until(() => q(".dt-card"), "문제"); snap("pick");
        await card(0); snap("picked");
        // 카드를 바꿔 눌러도 까닭 칸에 쓰던 글이 남아야 합니다.
        q("#reason").value = "쓰던 글"; q("#reason").dispatchEvent(new Event("input")); await card(3);
        await until(() => q('.dt-card[data-i="3"]').getAttribute("aria-pressed") === "true", "카드 ④ 누름");
        if (q("#reason").value !== "쓰던 글") throw new Error("카드를 바꾸자 까닭 칸 글이 지워짐"); await card(0);
        reason("집이 부서진 건 이상해요"); await until(() => q(".dt-line"), "맞는 문장 뒤"); snap("wrong-1");
        await card(1); if (q("#reason").value !== "") throw new Error("보낸 뒤에도 까닭 칸에 글이 남음");
        await card(1); queue("PENDING"); reason("군인만 다친 게 아니에요"); await until(() => q(".thinking"), "생각 중"); snap("waiting");
        await home();
        await go(); click("시작"); await until(() => q(".dt-card"), "문제");
        await card(1); queue(ASK("피란 가던 사람들은 안전했을까요?")); reason("아니에요"); await until(asking, "이어 묻는 질문"); snap("follow");
        queue(ASK("마을에서 싸움이 나면 누가 다칠까요?")); await answer("피란 가던 사람은 괜찮았어요"); await until(() => asking() && asking().textContent.startsWith("마을"), "질문 2");
        queue({ result: "found" }); await answer("군인이요"); await until(() => btn("다음 문제"), "넘어가기"); snap("between-found");
        if (!btn("바로 정리하기")) throw new Error("다음 문제 화면에 [바로 정리하기]가 없음");
        click("다음 문제"); await until(() => q(".dt-card") && !q(".dt-line"), "문제 2");
        // 둘째 문제도 오늘 차시(3-12)의 다른 오개념 3-2.m08.a 입니다(숨은 문장 ①).
        await card(1); reason("시설이 부서진 건 이상해요"); await until(() => q(".dt-line"), "맞는 문장 뒤");
        await card(0); queue({ result: "solved", question: "" }); reason("휴전선 때문에 오가지 못해서 못 만났어요"); await until(() => btn("결과 보기"), "넘어가기"); snap("between-solved");
        click("결과 보기"); await until(done, "결과"); snap("result");
        await home();
        await go(); click("시작"); await until(() => q(".dt-card"), "문제");
        await card(0); reason("몰라요"); await until(() => q(".dt-line"), "맞는 문장 뒤");
        await card(2); reason("몰라요"); await until(() => btn("다음 문제"), "넘어가기"); snap("between-wrong");
        await home();
        await go(); click("시작"); await until(() => q(".dt-card"), "문제");
        await card(1); queue(new Error("연결 실패")); reason("보통 사람도 다쳤어요"); await until(() => q(".error-box"), "오류"); snap("error");
        click("바로 정리하기"); await until(done, "오류 뒤 결과"); snap("error-finish");
        // 오늘 차시(3-11)에 오개념이 하나뿐이면 둘째 문제는 앞 차시에서 나오고 '앞에서 배운 내용 복습'이 붙습니다.
        await home(); await pick("#method", "detective"); await pick("#lesson", "3-11");
        await go(); click("시작"); await until(() => q(".dt-card"), "문제");
        if (q(".dt-review")) throw new Error("오늘 차시 첫 문제에 복습 표시가 붙음");
        const first = window.SOK_DETECTIVE_FIXTURE.find((p) => p.id === "3-2.m02.a");
        await card(first.hidden); queue({ result: "solved", question: "" }); reason("이상해요"); await until(() => btn("다음 문제"), "넘어가기");
        click("다음 문제"); await until(() => q(".dt-review"), "복습 표시"); snap("review");
        click("바로 정리하기"); await until(done, "복습 결과");
        if (!/문제 2 · 앞에서 배운 내용 복습/.test($("screen").textContent)) throw new Error("결과에 복습 표시가 없음");
        // 이어 묻는 중 [바로 정리하기]: AI가 마지막 판단을 한 뒤 결과로 갑니다.
        await home(); await pick("#lesson", "3-12");
        await go(); click("시작"); await until(() => q(".dt-card"), "문제");
        await card(1); queue(ASK("피란 가던 사람들은 안전했을까요?")); reason("아니에요"); await until(asking, "이어 묻는 질문");
        queue({ result: "solved" }); click("바로 정리하기"); await until(done, "이어 묻는 중 정리"); snap("follow-finish");
        if (!q(".mark.dt-solved")) throw new Error("이어 묻는 중 정리했는데 AI 마지막 판단(까닭까지 밝혔어요)이 표시되지 않음");
        // 이어 묻는 질문에 "모르겠어요"만 답하면 AI를 부르지 않고 바로 "선생님과 함께 더 알아봐요"로 마무리합니다.
        await home();
        await go(); click("시작"); await until(() => q(".dt-card"), "문제");
        await card(1); queue(ASK("피란 가던 사람들은 안전했을까요?")); reason("아니에요"); await until(asking, "이어 묻는 질문");
        await answer("모르겠어요"); await until(() => btn("다음 문제"), "모르겠어요 뒤 마무리"); snap("follow-dontknow");
        if (!/선생님과 함께 더 알아봐요/.test(q(".dt-line").textContent)) throw new Error("모르겠어요 뒤 마무리 문구가 다름");
      },
    };
    // 기준값과 지금 화면 사이에 일부러 생긴 차이를 맞추는 곳입니다. 차분한 튜터 디자인으로 기준값을 새로 찍어 지금은 비어 있습니다.
    // 예) const ADJUST = { elenchus: { start: (h) => h.replace("옛 글", "새 글") } };
    const ADJUST = {};

    try {
      await SCENES[run]();
      $("status").textContent = `장면 ${Object.keys(shots).length}개`;
    } catch (e) {
      if (e !== "STOP") { $("status").textContent = `실패: ${e && e.message || e}`; return; }
      $("status").textContent = `${stopAt} 장면에서 멈춤`;
      return;
    }

    if (params.has("compare")) {
      const base = (window.SOK_VIEWS_BASELINE || {})[run];
      if (!base) { $("status").textContent = "기준값이 없어요"; return; }
      const names = Object.keys(base);
      const want = (n) => ((ADJUST[run] || {})[n] || ((h) => h))(base[n]);
      const diffs = names.filter((n) => want(n) !== shots[n]).map((n) => {
        const a = want(n), b = shots[n] || "";
        let i = 0; while (i < a.length && a[i] === b[i]) i++;
        return `${n} @${i}\n  기준: ${a.slice(Math.max(0, i - 60), i + 120)}\n  지금: ${b.slice(Math.max(0, i - 60), i + 120)}`;
      });
      $("status").textContent = `같음 ${names.length - diffs.length}/${names.length}`;
      $("out").textContent = diffs.join("\n\n");
    } else {
      $("out").textContent = JSON.stringify({ [run]: shots });
    }
  })();
  </script>
</body>
</html>
