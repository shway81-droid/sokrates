<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오답 탐정 문제 목록</title>
  <style>
    :root { --bg: #fbf6ec; --paper: #fffdf8; --ink: #2b2118; --soft: #6b5a48; --line: #e6d9c3; --accent: #1f6f6b; --hid: #fff1d6; --hidline: #c98a1b; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Noto Sans KR", "Malgun Gothic", sans-serif; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    h2 { font-size: 19px; margin: 28px 0 8px; }
    .lead { color: var(--soft); margin: 0 0 12px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    select, input { font: inherit; padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--paper); }
    .misc { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
    .misc h3 { margin: 0 0 4px; font-size: 16px; }
    .k { color: var(--soft); font-size: 13px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
    .prob { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .prob ol { margin: 6px 0; padding-left: 22px; }
    .prob li { margin: 2px 0; }
    .prob li.hid { background: var(--hid); border-left: 4px solid var(--hidline); padding-left: 6px; }
    .tag { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-right: 4px; }
    .ok { color: #2f7a3e; font-weight: 700; }
    @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>오답 탐정 문제 목록</h1>
  <p class="lead">오개념마다 문제 2벌입니다. 색이 칠해진 줄이 틀린 생각이 숨은 문장이고, 나머지 세 문장은 교과서 원문으로 확인한 맞는 문장입니다.</p>
  <div class="bar">
    <label>교과서 <select id="tb"><option value="">모두</option><option value="chunjae">천재교과서</option><option value="icecream">아이스크림미디어</option><option value="visang">비상교육</option></select></label>
    <span id="count" class="k"></span>
  </div>
  <div id="list"></div>
</main>
<script src="../data/topic-3-1.js?v=3"></script>
<script src="../data/topic-3-2.js?v=3"></script>
<script src="../data/detective-3-1.js?v=5"></script>
<script src="../data/detective-3-2.js?v=4"></script>
<script>
(function () {
  const TB = { chunjae: "천재", icecream: "아이스크림", visang: "비상" };
  const topics = window.SOKRATES_TOPICS;
  const data = window.SokDetectiveData;
  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs, kids) => { const e = document.createElement(tag); Object.assign(e, attrs || {}); (kids || []).forEach((k) => k && e.append(k)); return e; };

  function render() {
    const tb = $("tb").value;
    $("list").textContent = "";
    let n = 0;
    for (const unitId of ["3-1", "3-2"]) {
      const topic = topics[unitId];
      const probs = (data[unitId] || { problems: [] }).problems;
      $("list").append(h("h2", { textContent: `${unitId} ${topic.title || ""}` }));
      for (const m of topic.misconceptions) {
        const ps = probs.filter((p) => p.misconception === m.id && (!tb || p.textbooks.includes(tb)));
        if (!ps.length) continue;
        n += ps.length;
        const src = Object.entries(m.sources).map(([k, v]) => `${TB[k]} ${v.lesson}`).join(" · ");
        $("list").append(h("div", { className: "misc" }, [
          h("h3", { textContent: `${m.id} 틀린 생각: ${m.wrong}` }),
          h("div", { className: "k", textContent: `바른 생각: ${m.truth} · 차시: ${src}` }),
          h("div", { className: "pair" }, ps.map((p) => h("div", { className: "prob" }, [
            h("div", {}, [h("b", { textContent: p.id + " " }), ...p.textbooks.map((t) => h("span", { className: "tag", textContent: TB[t] })),
              p.reviewed ? h("span", { className: "ok", textContent: " 원문 대조 완료" }) : h("span", { textContent: " 검증 전" })]),
            h("ol", {}, p.sentences.map((s, i) => h("li", { className: i === p.hidden ? "hid" : "", textContent: s }))),
            h("div", { className: "k", textContent: `핵심: ${p.key}` }),
            h("div", { className: "k", textContent: `이어 묻는 질문의 예: ${p.hints.join(" / ")}` }),
            h("div", { className: "k", textContent: `정답 낱말(AI가 먼저 말하면 안 됨): ${p.leakWords.join(", ")}` }),
          ]))),
        ]));
      }
    }
    $("count").textContent = `${n}문제`;
  }
  $("tb").addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
